# Render blueprint for the Excel Academy API.
#
# Secrets are NOT in this file. FIREBASE_SERVICE_ACCOUNT_BASE64 is marked
# sync:false, which means Render prompts for it once and stores it encrypted.
services:
  - type: web
    name: excel-academy-api
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Courses and payments read from Firestore; MongoDB is retired.
      - key: DATA_SOURCE
        value: firestore
      - key: VIDEO_BASE_URL
        value: https://courses.excelacademyonline.com/wp-content/uploads
      # Public Firebase web config - these ship inside the apps already.
      - key: FIREBASE_PROJECT_ID
        value: excel-academy-online
      - key: projectId
        value: excel-academy-online
      - key: FIREBASE_API_KEY
        value: AIzaSyD_b49nKGyE6FrKyJ0X0GipuiTn9nwZOnI
      - key: apiKey
        value: AIzaSyD_b49nKGyE6FrKyJ0X0GipuiTn9nwZOnI
      - key: FIREBASE_AUTH_DOMAIN
        value: excel-academy-online.firebaseapp.com
      - key: authDomain
        value: excel-academy-online.firebaseapp.com
      - key: FIREBASE_STORAGE_BUCKET
        value: excel-academy-online.appspot.com
      - key: storageBucket
        value: excel-academy-online.appspot.com
      - key: FIREBASE_MESSAGING_SENDER_ID
        value: "1027112230279"
      - key: messagingSenderId
        value: "1027112230279"
      - key: FIREBASE_APP_ID
        value: 1:1027112230279:web:7356d98f35a5b54df9c722
      - key: appId
        value: 1:1027112230279:web:7356d98f35a5b54df9c722
      # The one real secret. Paste the contents of RENDER-SECRET.txt.
      - key: FIREBASE_SERVICE_ACCOUNT_BASE64
        sync: false
      # Browser origins allowed to call the API. Add the dashboard's URL.
      - key: CORS_ORIGINS
        sync: false
