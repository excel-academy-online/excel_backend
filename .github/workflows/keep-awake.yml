# Render's free plan puts the API to sleep after 15 minutes without traffic,
# and the first request after that takes ~40s while it wakes up - long enough
# that the app looks stuck on "loading". Pinging /health every 10 minutes
# keeps it awake. (A paid Render plan doesn't sleep; then delete this.)
name: Keep API awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 90 https://excel-academy-api-deic.onrender.com/health || true
